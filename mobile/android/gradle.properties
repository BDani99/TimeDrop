org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler computes relative paths between the Gradle
# cache and the project directory. On Windows, when the project and the pub
# cache (~/AppData/Local/Pub/Cache) live on different drive letters (e.g.
# project on E:, cache on C:), that relative-path computation throws
# (java.lang.IllegalArgumentException: this and base files have different
# roots). Disabling incremental compilation avoids that path entirely.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
